# TestSprite check — Season 4 hackathon
#
# Token TestSprite terbatas, jadi check TIDAK lagi otomatis di setiap PR.
# Test hanya jalan kalau PR ini diberi label `run-testsprite`.
#
# Pakai saat sudah siap dan ingin tahu hasilnya:
#   gh pr edit <nomor> --add-label run-testsprite
# atau lewat web: PR -> Labels -> run-testsprite
#
# Perhatikan `types: [labeled]` — event pull_request bawaan tidak memicu
# ulang saat label ditambahkan, jadi harus disebut eksplisit.
#
# Setup secret (sekali):
#   1. Akun gratis di https://www.testsprite.com
#   2. Generate test suite terhadap URL live (bukan localhost)
#   3. Settings -> Secrets -> Actions: TESTSPRITE_API_KEY
#      dan TESTSPRITE_PROJECT_ID (dari Settings -> Project di portal)

name: TestSprite

on:
  pull_request:
    branches: [main]
    types: [labeled]

jobs:
  testsprite:
    runs-on: ubuntu-latest
    # Jalan hanya untuk PR berlabel run-testsprite, dan hanya dari repo
    # sendiri. Fork tidak punya repository secrets -> api-key kosong ->
    # check selalu merah.
    if: >-
      github.event.pull_request.labels.*.name == 'run-testsprite' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Run TestSprite check
        uses: TestSprite/testsprite-action@v1
        with:
          api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          # Project id dari portal TestSprite 3.0 (Settings -> Project).
          # Wajib: tanpa ini CLI gagal dengan
          # "VALIDATION_ERROR: --all requires a project id".
          project: ${{ secrets.TESTSPRITE_PROJECT_ID }}
